<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="jsNavGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f284e" />
      <stop offset="100%" stop-color="#1b3b6f" />
    </linearGradient>
    <linearGradient id="jsSaffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9933" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
  </defs>
  <!-- Rounded Base Emblem -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#jsNavGrad)" stroke="#2563eb" stroke-width="1.5" />
  
  <!-- Subtle Top Tricolor Pip -->
  <path d="M 16 7 L 32 7" stroke="#ff9933" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 19 10 L 29 10" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
  <path d="M 21 12.5 L 27 12.5" stroke="#138808" stroke-width="1.5" stroke-linecap="round" />

  <!-- The Setu (Bridge) Arch Symbolizing Public Connection -->
  <path d="M 8 36 C 14 22, 34 22, 40 36" fill="none" stroke="url(#jsSaffronGrad)" stroke-width="3" stroke-linecap="round" />
  <!-- Under-bridge Water / Reflection Line -->
  <path d="M 12 39 C 18 33, 30 33, 36 39" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  
  <!-- Central Family / Integrity Node -->
  <circle cx="24" cy="20" r="4" fill="#ffffff" />
  <circle cx="24" cy="20" r="2" fill="#0f284e" />
  
  <!-- Left & Right Family Pillars -->
  <circle cx="16" cy="24" r="2.5" fill="#fed7aa" />
  <circle cx="32" cy="24" r="2.5" fill="#fed7aa" />

  <!-- Subtle 'JS' Monogram Accent -->
  <path d="M 14 36 L 34 36" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
</svg>
