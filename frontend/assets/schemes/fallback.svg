<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="fallbackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f284e"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <rect width="400" height="200" fill="url(#fallbackBg)"/>

  <!-- Subtle circles -->
  <circle cx="200" cy="100" r="75" fill="#ffffff" opacity="0.04"/>
  <circle cx="200" cy="100" r="105" fill="#ffffff" opacity="0.02"/>

  <!-- Central Government Scheme Emblem Graphic -->
  <g transform="translate(160, 45)">
    <!-- Document Backdrop -->
    <rect x="15" y="10" width="50" height="65" rx="6" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    
    <!-- Central Shield & Ribbon -->
    <circle cx="40" cy="42" r="22" fill="url(#emblemGrad)" opacity="0.9"/>
    <!-- Checkmark / Welfare Setu Ribbon -->
    <path d="M30,42 L37,49 L50,34" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Seal Ribbon Tails -->
    <polygon points="32,60 40,75 48,60" fill="#ea580c" opacity="0.9"/>
  </g>

  <!-- Tagline text below -->
  <text x="200" y="145" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">
    GOVERNMENT CITIZEN WELFARE SCHEME
  </text>
  <text x="200" y="162" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">
    JanSetu Unified Public Documentation Platform
  </text>

  <!-- Fallback Badge -->
  <g transform="translate(24, 20)">
    <rect width="130" height="26" rx="13" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="14" cy="13" r="7" fill="#3b82f6"/>
    <path d="M12,13 L14,15 L17,11" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="26" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">CITIZEN SCHEME</text>
  </g>
</svg>
