<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="foodGradSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="sackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="grainGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>

  <!-- Warm Golden Amber Background -->
  <rect width="400" height="200" fill="url(#foodGradSky)"/>

  <!-- Warm Glow in center -->
  <circle cx="200" cy="110" r="90" fill="#f59e0b" opacity="0.2"/>

  <!-- Golden Wheat Sheaves Pattern Background -->
  <g opacity="0.25" stroke="#fde68a" stroke-width="1.5">
    <path d="M50,180 Q60,110 90,80"/>
    <path d="M70,180 Q80,120 110,90"/>
    <path d="M350,180 Q340,110 310,80"/>
    <path d="M330,180 Q320,120 290,90"/>
  </g>

  <!-- Grain Sacks (Ration Grains: Wheat & Rice) -->
  <g transform="translate(130, 80)">
    <!-- Rear Sack (Rice) -->
    <path d="M75,30 C70,18 95,15 105,25 C115,35 125,75 118,95 C112,110 70,110 65,95 C60,80 70,40 75,30 Z" 
          fill="#d97706" opacity="0.9"/>
    <ellipse cx="90" cy="22" rx="12" ry="4" fill="#b45309"/>

    <!-- Front Big Sack (Wheat / NFSA) -->
    <path d="M25,20 C18,8 55,5 65,18 C78,30 90,80 80,105 C72,120 20,120 12,105 C5,88 18,35 25,20 Z" 
          fill="url(#sackGrad)"/>
    <!-- Tied Top string -->
    <ellipse cx="45" cy="16" rx="14" ry="5" fill="#78350f"/>
    <line x1="32" y1="20" x2="58" y2="20" stroke="#fef3c7" stroke-width="2"/>

    <!-- Grain Overflow -->
    <ellipse cx="45" cy="14" rx="9" ry="3.5" fill="url(#grainGrad)"/>

    <!-- Sack Label: NFSA -->
    <rect x="26" y="52" width="38" height="22" rx="3" fill="#fef3c7" opacity="0.9"/>
    <text x="45" y="62" fill="#78350f" font-family="system-ui, sans-serif" font-size="7" font-weight="900" text-anchor="middle">NFSA</text>
    <text x="45" y="70" fill="#b45309" font-family="system-ui, sans-serif" font-size="6" font-weight="700" text-anchor="middle">RATION</text>
  </g>

  <!-- Balance Scale of Fair Distribution (Right) -->
  <g transform="translate(245, 75)" stroke="#fde68a" stroke-width="2" fill="none">
    <!-- Center Post -->
    <line x1="40" y1="15" x2="40" y2="85"/>
    <path d="M25,85 L55,85" stroke-linecap="round"/>
    <circle cx="40" cy="15" r="3" fill="#fde68a"/>
    <!-- Beam -->
    <line x1="10" y1="25" x2="70" y2="25"/>
    <!-- Pan Left -->
    <line x1="10" y1="25" x2="0" y2="52"/>
    <line x1="10" y1="25" x2="20" y2="52"/>
    <path d="M-5,52 Q10,62 25,52 Z" fill="#f59e0b" stroke="#fde68a"/>
    <!-- Pan Right -->
    <line x1="70" y1="25" x2="60" y2="52"/>
    <line x1="70" y1="25" x2="80" y2="52"/>
    <path d="M55,52 Q70,62 85,52 Z" fill="#f59e0b" stroke="#fde68a"/>
  </g>

  <!-- Spilled golden grains at base -->
  <ellipse cx="175" cy="182" rx="45" ry="7" fill="#f59e0b" opacity="0.4"/>
  <circle cx="155" cy="181" r="2.5" fill="#fef3c7"/>
  <circle cx="163" cy="183" r="2.2" fill="#fde68a"/>
  <circle cx="172" cy="180" r="2.8" fill="#fef3c7"/>
  <circle cx="185" cy="182" r="2.4" fill="#fde68a"/>
  <circle cx="194" cy="181" r="2" fill="#fef3c7"/>

  <!-- Category Tag (Top Left) -->
  <g transform="translate(24, 20)">
    <rect width="124" height="26" rx="13" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="14" cy="13" r="7" fill="#d97706"/>
    <path d="M12,13 L14,15 L17,11" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="26" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">FOOD SECURITY</text>
  </g>
</svg>
