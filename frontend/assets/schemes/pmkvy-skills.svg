<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="skillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="certGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Deep Indigo Skill Background -->
  <rect width="400" height="200" fill="url(#skillBg)"/>

  <!-- Subtle Digital Circuit / Tech Grid Elements -->
  <g stroke="#818cf8" stroke-width="1.2" opacity="0.25" fill="none">
    <path d="M40,50 L90,50 L110,70 L170,70"/>
    <circle cx="170" cy="70" r="3" fill="#818cf8"/>
    <path d="M40,150 L100,150 L130,120 L160,120"/>
    <circle cx="160" cy="120" r="3" fill="#818cf8"/>
    <path d="M360,50 L310,50 L290,70 L240,70"/>
    <circle cx="240" cy="70" r="3" fill="#818cf8"/>
    <path d="M360,150 L300,150 L270,120 L240,120"/>
    <circle cx="240" cy="120" r="3" fill="#818cf8"/>
  </g>

  <!-- Central Cogwheel / Technical Skill Gear -->
  <g transform="translate(200, 105)">
    <!-- Gear Outer -->
    <path d="M-15,-48 L15,-48 L12,-38 C19,-35 25,-32 31,-26 L40,-31 L58,-13 L52,-4 C55,2 57,9 58,16 L68,20 L68,45 L58,48 C56,55 53,62 48,68 L53,78 L35,96 L25,90 C18,94 11,97 4,98 L0,108 L-25,108 L-28,98 C-35,96 -42,93 -48,88 L-58,93 L-76,75 L-70,66 C-74,59 -76,52 -78,45 L-88,41 L-88,16 L-78,13 C-76,6 -73,-1 -68,-7 L-73,-17 L-55,-35 L-45,-30 C-39,-34 -32,-37 -25,-38 Z"
          fill="#38bdf8" opacity="0.2" transform="scale(0.85) translate(0, -30)"/>
  </g>

  <!-- Skill Certification Certificate (Left Center) -->
  <g transform="translate(115, 60)">
    <!-- Shadow -->
    <rect x="5" y="5" width="80" height="95" rx="5" fill="#0f172a" opacity="0.4"/>
    <!-- Document -->
    <rect x="0" y="0" width="80" height="95" rx="5" fill="url(#certGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Gold Header Ribbon -->
    <rect x="10" y="10" width="60" height="8" rx="2" fill="#2563eb"/>
    <line x1="14" y1="28" x2="66" y2="28" stroke="#94a3b8" stroke-width="2"/>
    <line x1="14" y1="36" x2="55" y2="36" stroke="#cbd5e1" stroke-width="1.8"/>
    <line x1="14" y1="44" x2="62" y2="44" stroke="#cbd5e1" stroke-width="1.8"/>
    <line x1="14" y1="52" x2="48" y2="52" stroke="#cbd5e1" stroke-width="1.8"/>

    <!-- Gold Certified Seal -->
    <circle cx="56" cy="72" r="11" fill="url(#goldCap)"/>
    <path d="M52,72 L55,75 L61,68" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Seal Ribbon tails -->
    <polygon points="51,80 56,92 61,80" fill="#d97706"/>
  </g>

  <!-- Graduation Mortarboard / Youth Empowerment (Right Center) -->
  <g transform="translate(225, 65)">
    <!-- Cap Diamond -->
    <polygon points="50,15 95,35 50,55 5,35" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="50,22 85,35 50,48 15,35" fill="#0284c7" opacity="0.6"/>

    <!-- Skull cap base -->
    <path d="M22,42 C22,60 78,60 78,42" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Tassel -->
    <circle cx="50" cy="35" r="3.5" fill="#f59e0b"/>
    <path d="M50,35 Q65,42 75,58" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
    <rect x="72" y="58" width="6" height="12" rx="1.5" fill="#d97706"/>

    <!-- Tools / Spanner & Screwdriver Icon badge below -->
    <g transform="translate(15, 68)">
      <rect width="70" height="24" rx="12" fill="#22c55e" fill-opacity="0.2" stroke="#4ade80" stroke-width="1"/>
      <text x="35" y="16" fill="#4ade80" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">STIPEND ₹8K</text>
    </g>
  </g>

  <!-- Category Tag (Top Left) -->
  <g transform="translate(24, 20)">
    <rect width="138" height="26" rx="13" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="14" cy="13" r="7" fill="#8b5cf6"/>
    <path d="M12,13 L14,15 L17,11" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="26" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">SKILL DEVELOPMENT</text>
  </g>
</svg>
