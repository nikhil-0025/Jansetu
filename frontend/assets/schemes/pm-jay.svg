<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGradHealth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- Deep Blue Healthcare Background -->
  <rect width="400" height="200" fill="url(#skyGradHealth)"/>

  <!-- Subtle Ambient Glow Rings -->
  <circle cx="200" cy="100" r="85" fill="#38bdf8" opacity="0.12"/>
  <circle cx="200" cy="100" r="120" fill="#38bdf8" opacity="0.06"/>

  <!-- Dynamic ECG / Heartbeat Line Across Center -->
  <path d="M0,135 L120,135 L132,115 L142,150 L154,80 L168,165 L178,135 L400,135" 
        stroke="#7dd3fc" stroke-width="2.5" fill="none" opacity="0.55" stroke-linecap="round"/>

  <!-- Central Shield of Health Security (₹5 Lakh Cover) -->
  <g transform="translate(160, 45)">
    <!-- Shield Shadow -->
    <path d="M40,5 C70,5 75,18 75,45 C75,80 40,105 40,105 C40,105 5,80 5,45 C5,18 10,5 40,5 Z" 
          fill="#0c4a6e" opacity="0.5" transform="translate(2, 4)"/>
    
    <!-- Outer Shield -->
    <path d="M40,5 C70,5 75,18 75,45 C75,80 40,105 40,105 C40,105 5,80 5,45 C5,18 10,5 40,5 Z" 
          fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="2"/>

    <!-- Medical Plus Symbol inside Shield -->
    <path d="M40,25 L40,65 M20,45 L60,45" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
    <circle cx="40" cy="45" r="4" fill="#ffffff"/>
  </g>

  <!-- Stethoscope Motif (Left side) -->
  <g transform="translate(60, 60)" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.85">
    <path d="M20,15 C20,45 60,45 60,15" stroke-linecap="round"/>
    <path d="M40,45 L40,75 C40,90 65,90 65,75"/>
    <circle cx="65" cy="75" r="7" fill="#38bdf8" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Earpieces -->
    <circle cx="20" cy="15" r="3" fill="#ffffff"/>
    <circle cx="60" cy="15" r="3" fill="#ffffff"/>
  </g>

  <!-- Hospital / Clinic Cross Symbol (Right side) -->
  <g transform="translate(290, 70)">
    <rect width="50" height="50" rx="10" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
    <!-- Heart outline -->
    <path d="M25,37 C15,28 12,20 18,15 C22,12 25,16 25,16 C25,16 28,12 32,15 C38,20 35,28 25,37 Z" fill="#ef4444" opacity="0.95"/>
    <!-- ₹5L badge badge -->
    <rect x="5" y="42" width="40" height="15" rx="7.5" fill="#15803d"/>
    <text x="25" y="53" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" font-weight="800" text-anchor="middle">₹5 LAKH</text>
  </g>

  <!-- Category Tag (Top Left) -->
  <g transform="translate(24, 20)">
    <rect width="110" height="26" rx="13" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="14" cy="13" r="7" fill="#0284c7"/>
    <path d="M12,13 L14,15 L17,11" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="26" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">HEALTHCARE</text>
  </g>
</svg>
